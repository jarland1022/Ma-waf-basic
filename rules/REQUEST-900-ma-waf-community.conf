# Ma-WAF Community — 在 OWASP CRS 之前执行
# 挂载到：/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
#
# 社区版只保留「能独立运行」的防护。多站点、地理封锁、威胁情报、
# SIEM、合规报表、JS 挑战与商用规则升级属于专业版，不在本仓库实现。

# 已知扫描器 UA。搜索引擎等正常客户端不受影响。
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(sqlmap|nikto|nessus|masscan|zgrab|dirbuster|havij|w3af|acunetix)" \
    "id:110200,phase:1,deny,status:403,log,auditlog,\
msg:'Ma-WAF Community blocked scanner user-agent',\
tag:'ma-waf-community',tag:'bot',\
severity:'CRITICAL'"

# IP 黑名单：每行一条，取消注释并改成真实地址后重启 waf 容器。
# 控制台批量维护、地理封锁、情报自动封禁请使用专业版。
