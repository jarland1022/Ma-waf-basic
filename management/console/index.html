<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ma-WAF 管理控制台</title>
  <link rel="stylesheet" href="/assets/app.css?v=20260918i18n3" />
</head>
<body class="auth-login">
  <div id="loginView" class="login-wrap">
    <form class="login-card" id="loginForm">
      <div class="brand">
        <img class="brand-logo" src="/assets/logo.png" width="56" height="56" alt="Ma-WAF" />
        <div>
          <h1>Ma-WAF</h1>
          <p data-i18n-zh="企业级 Web 应用防火墙" data-i18n-en="Enterprise Web Application Firewall">企业级 Web 应用防火墙</p>
        </div>
      </div>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="zh" class="lang-btn">中文</button>
        <button type="button" data-lang="en" class="lang-btn">English</button>
      </div>
      <label data-i18n-zh="用户名" data-i18n-en="Username">用户名</label>
      <input id="user" value="admin" autocomplete="username" />
      <label data-i18n-zh="密码" data-i18n-en="Password">密码</label>
      <input id="pass" type="password" autocomplete="current-password"
        data-i18n-placeholder-zh="默认 admin（未配置哈希时）"
        data-i18n-placeholder-en="Default admin (when hash not configured)"
        placeholder="默认 admin（未配置哈希时）" />
      <label data-i18n-zh="TOTP（可选）" data-i18n-en="TOTP (optional)">TOTP（可选）</label>
      <input id="totp"
        data-i18n-placeholder-zh="未启用双因素可留空"
        data-i18n-placeholder-en="Leave blank if 2FA is not enabled"
        placeholder="未启用双因素可留空" />
      <button type="submit" data-i18n-zh="登录" data-i18n-en="Sign in">登录</button>
      <div class="msg err" id="loginErr"></div>
    </form>
  </div>

  <div id="appView" class="shell">
    <header class="hs-header">
      <div class="hs-brand">
        <span class="hs-logo">Ma-WAF</span>
        <span class="hs-model">Console</span>
      </div>
      <nav class="hs-topnav" id="topNav" aria-label="Main modules" data-i18n-zh="主模块" data-i18n-en="Main modules" data-i18n-attr="aria-label"></nav>
      <div class="hs-header-right">
        <div class="lang-switch lang-switch--header" role="group" aria-label="Language">
          <button type="button" data-lang="zh" class="lang-btn">中文</button>
          <button type="button" data-lang="en" class="lang-btn">English</button>
        </div>
        <span class="hs-chip" id="sideMode">引擎: -</span>
        <span class="hs-chip" id="hdrDevice" data-i18n-zh="本机" data-i18n-en="Local">本机</span>
        <a class="hs-link" id="manualLink" href="/assets/manual.html" target="_blank" rel="noopener"
          data-i18n-zh="用户手册" data-i18n-en="User Manual"
          data-i18n-title-zh="打开用户手册" data-i18n-title-en="Open user manual"
          title="打开用户手册">用户手册</a>
        <button type="button" class="hs-link" id="logoutBtn" data-i18n-zh="退出" data-i18n-en="Sign out">退出</button>
      </div>
    </header>

    <div class="hs-body">
      <aside class="hs-sidebar">
        <div class="hs-side-title" id="sideTitle" data-i18n-zh="模块" data-i18n-en="Module">模块</div>
        <nav id="nav" class="hs-sidenav" aria-label="Submenu" data-i18n-zh="子菜单" data-i18n-en="Submenu" data-i18n-attr="aria-label"></nav>
        <button type="button" class="hs-collapse" id="sideCollapse"
          data-i18n-zh="收起" data-i18n-en="Collapse"
          data-i18n-title-zh="收起侧栏" data-i18n-title-en="Collapse sidebar"
          title="收起侧栏">收起</button>
      </aside>

      <main class="hs-main">
        <div class="hs-crumb" id="pageCrumb">首页 / 总览</div>
        <header class="topbar">
          <div>
            <h2 id="pageTitle">总览</h2>
            <p id="pageSub" class="muted">攻击态势 · 引擎状态 · 关键指标</p>
          </div>
          <div class="top-actions">
            <button type="button" class="ghost" id="refreshBtn" data-i18n-zh="刷新" data-i18n-en="Refresh">刷新</button>
            <button type="button" id="reloadBtn">Reload Nginx</button>
          </div>
        </header>
        <div class="msg err" id="appErr"></div>
        <div class="msg ok" id="appOk"></div>
        <section id="pageRoot"></section>
      </main>
    </div>
  </div>

  <div id="drawer" class="drawer" hidden>
    <div class="drawer-panel">
      <div class="drawer-head">
        <h3 id="drawerTitle" data-i18n-zh="事件详情" data-i18n-en="Event details">事件详情</h3>
        <button type="button" class="ghost" id="drawerClose" data-i18n-zh="关闭" data-i18n-en="Close">关闭</button>
      </div>
      <pre id="drawerBody" class="mono drawer-body"></pre>
    </div>
  </div>

  <script src="/assets/i18n.js?v=20260918i18n3"></script>
  <script src="/assets/app.js?v=20260918i18n3"></script>
</body>
</html>
