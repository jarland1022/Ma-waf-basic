<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>登录 — Ma-WAF Community</title>
  <link rel="stylesheet" href="assets/site.css"/>
</head>
<body class="auth-login">
  <div class="login-wrap">
    <form class="login-card" id="loginForm">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">Ma</div>
        <div>
          <h1>Ma-WAF</h1>
          <p>社区版控制台</p>
          <span class="badge-trial">Community</span>
        </div>
      </div>
      <label for="user">用户名</label>
      <input id="user" name="username" value="admin" autocomplete="username" />
      <label for="pass">密码</label>
      <input id="pass" name="password" type="password"
        placeholder="默认 admin" autocomplete="current-password" />
      <button type="submit">登录</button>
      <div class="msg err" id="loginErr"></div>
      <p class="login-hint">安装后默认 <code>admin</code> / <code>admin</code>。登录后可查看拦截事件、维护 IP 黑名单，并把流量接到你的业务。</p>
    </form>
  </div>
  <script src="config.js"></script>
  <script src="assets/site.js"></script>
  <script>
    (function () {
      if (MaWafAuth.isAuthed()) {
        location.replace("home.html");
        return;
      }
      document.getElementById("loginForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        var err = document.getElementById("loginErr");
        err.textContent = "";
        try {
          await MaWafAuth.login(
            document.getElementById("user").value,
            document.getElementById("pass").value
          );
          location.href = "home.html";
        } catch (ex) {
          err.textContent = ex.message || String(ex);
        }
      });
    })();
  </script>
</body>
</html>
