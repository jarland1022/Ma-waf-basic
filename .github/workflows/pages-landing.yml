# Public landing for Ma-WAF Community + Pro/Managed CTA.
# Add Variables on THIS public repo (jarland1022/Ma-waf-basic), not the private Pro repo.
# Settings → Secrets and variables → Actions → Variables tab
name: Deploy landing (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "docs/marketing/landing.html"
      - ".github/workflows/pages-landing.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-landing
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require repository variables
        env:
          WHATSAPP_URL: ${{ vars.WHATSAPP_URL }}
          CALENDLY_URL: ${{ vars.CALENDLY_URL }}
          GITHUB_URL: ${{ vars.GITHUB_URL }}
          EMAIL: ${{ vars.EMAIL }}
          COMPANY: ${{ vars.COMPANY }}
        run: |
          missing=0
          for k in WHATSAPP_URL CALENDLY_URL GITHUB_URL EMAIL COMPANY; do
            if [ -z "${!k}" ]; then
              echo "::error::Set repository variable $k on jarland1022/Ma-waf-basic (Settings → Secrets and variables → Actions → Variables)"
              missing=1
            fi
          done
          exit $missing

      - name: Build site/
        env:
          WHATSAPP_URL: ${{ vars.WHATSAPP_URL }}
          CALENDLY_URL: ${{ vars.CALENDLY_URL }}
          GITHUB_URL: ${{ vars.GITHUB_URL }}
          EMAIL: ${{ vars.EMAIL }}
          COMPANY: ${{ vars.COMPANY }}
          CNAME: ${{ vars.CNAME }}
        run: |
          mkdir -p site
          sed \
            -e "s|YOUR_WHATSAPP_URL|${WHATSAPP_URL}|g" \
            -e "s|YOUR_CALENDLY_URL|${CALENDLY_URL}|g" \
            -e "s|YOUR_GITHUB_URL|${GITHUB_URL}|g" \
            -e "s|YOUR_EMAIL|${EMAIL}|g" \
            -e "s|YOUR_COMPANY|${COMPANY}|g" \
            docs/marketing/landing.html > site/index.html
          if [ -n "${CNAME}" ]; then
            printf '%s\n' "$CNAME" > site/CNAME
          fi
          if grep -n 'YOUR_' site/index.html; then
            echo "::error::Placeholders left in site/index.html"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
