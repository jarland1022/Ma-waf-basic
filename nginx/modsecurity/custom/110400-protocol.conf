# protocol hardening (ids 110400-110499)
# IMPORTANT: do not use unfinished SecRule chains before Include boundaries

SecRule REQUEST_METHOD "@rx ^(?:TRACE|TRACK)$" "id:110401,phase:1,deny,status:405,msg:'HTTP method not allowed',tag:'protocol',tag:'ma-waf-protocol',severity:'WARNING'"

# HTTP request smuggling hint: Transfer-Encoding present (strict sites may deny)
# Keep as pass+log by default; change to deny if desired
SecRule REQUEST_HEADERS:Transfer-Encoding "@rx (?i)chunked" "id:110402,phase:1,pass,log,msg:'Chunked Transfer-Encoding present',tag:'protocol',tag:'ma-waf-protocol',severity:'NOTICE'"
