# custom upload checks (ids 110000-110099)

SecRule FILES_NAMES "@rx \.(?:php\d?|phtml|phar|jsp|asp|aspx|exe|sh|bash|cgi|pl)$" "id:110001,phase:2,deny,status:403,msg:'Blocked dangerous upload extension',logdata:'%{MATCHED_VAR}',tag:'attack-upload',tag:'ma-waf-upload',severity:'CRITICAL'"

SecRule FILES_NAMES "@rx \.(?:php|phtml|jsp|asp|aspx)\.[a-z0-9]+$" "id:110002,phase:2,deny,status:403,msg:'Blocked double-extension upload',tag:'attack-upload',tag:'ma-waf-upload',severity:'CRITICAL'"

SecRule FILES "@rx (?i)(?:<\?php|<%|#!/bin/(?:ba)?sh)" "id:110003,phase:2,deny,status:403,msg:'Blocked malicious upload content',tag:'attack-upload',tag:'ma-waf-upload',severity:'CRITICAL'"

SecRule FILES_SIZES "@gt 20971520" "id:110004,phase:2,deny,status:403,msg:'Upload file too large',tag:'attack-upload',tag:'ma-waf-upload',severity:'WARNING'"
