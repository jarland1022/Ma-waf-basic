# custom bot / scanner UA checks (ids 110200-110299)

SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(?:sqlmap|havij|nikto|nessus|openvas|w3af|acunetix|netsparker|burpsuite|dirbuster|gobuster|ffuf|wfuzz|masscan|zgrab)" "id:110201,phase:1,deny,status:403,msg:'Known bad bot or scanner UA',logdata:'%{MATCHED_VAR}',tag:'attack-bot',tag:'ma-waf-bot',severity:'CRITICAL'"

SecRule REQUEST_HEADERS:User-Agent "^$" "id:110202,phase:1,pass,log,msg:'Empty User-Agent (nginx JS challenge may apply)',tag:'attack-bot',tag:'ma-waf-bot',severity:'NOTICE'"

SecRule &REQUEST_HEADERS:Accept "@eq 0" "id:110203,phase:1,pass,log,msg:'Missing Accept header',tag:'attack-bot',tag:'ma-waf-bot',severity:'NOTICE'"
