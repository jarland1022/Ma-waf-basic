# session / ATO helpers (ids 110300-110399)
# 对齐 Imperva 类 Account Takeover：登录/凭证路径暴力尝试缓解

SecRule REQUEST_COOKIES "@rx (?i)(?:<script|javascript:)" \
    "id:110301,phase:2,deny,status:403,msg:'Suspicious cookie content',\
    tag:'session-protect',tag:'ma-waf-session',severity:'CRITICAL'"

# 登录与凭证相关 URI：累计尝试
SecRule REQUEST_URI "@rx (?i)/(?:login|signin|auth|oauth|token|sso|password|passwd|reset|forgot)" \
    "id:110302,phase:1,pass,nolog,\
    setvar:'ip.login_attempt=+1',expirevar:'ip.login_attempt=120',\
    tag:'session-protect',tag:'ma-waf-session'"

# 短窗高频 → 429（凭证填充）
SecRule IP:login_attempt "@gt 20" \
    "id:110303,phase:1,deny,status:429,msg:'Login rate exceeded (ATO)',\
    tag:'session-protect',tag:'ma-waf-session',tag:'ma-waf/ato',severity:'WARNING'"

# 更高阈值 → 403 硬拦截
SecRule IP:login_attempt "@gt 50" \
    "id:110304,phase:1,deny,status:403,msg:'Credential stuffing suspected',\
    tag:'session-protect',tag:'ma-waf-session',tag:'ma-waf/ato',severity:'CRITICAL'"

# 密码重置路径更严
SecRule REQUEST_URI "@rx (?i)/(?:password|passwd|reset|forgot)" \
    "id:110305,phase:1,pass,nolog,\
    setvar:'ip.reset_attempt=+1',expirevar:'ip.reset_attempt=300'"

SecRule IP:reset_attempt "@gt 10" \
    "id:110306,phase:1,deny,status:429,msg:'Password reset abuse',\
    tag:'session-protect',tag:'ma-waf/ato',severity:'WARNING'"
