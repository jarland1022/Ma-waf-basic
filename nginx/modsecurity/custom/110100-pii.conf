# custom PII leakage checks (ids 110100-110199)
# Tip: use DetectionOnly first if false positives are high

SecRule RESPONSE_BODY "@rx (?<!\d)[1-9]\d{5}(?:19|20)\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])\d{3}[\dXx](?!\d)" "id:110101,phase:4,pass,log,msg:'Possible ID card leakage in response',tag:'leakage-pii',tag:'ma-waf-pii',severity:'CRITICAL'"

SecRule RESPONSE_BODY "@rx (?<!\d)1[3-9]\d{9}(?!\d)" "id:110102,phase:4,pass,log,msg:'Possible mobile number leakage',tag:'leakage-pii',tag:'ma-waf-pii',severity:'WARNING'"

SecRule RESPONSE_BODY "@rx (?<!\d)(?:62|4\d|5[1-5])\d{14,17}(?!\d)" "id:110103,phase:4,pass,log,msg:'Possible bank card leakage',tag:'leakage-pii',tag:'ma-waf-pii',severity:'CRITICAL'"
