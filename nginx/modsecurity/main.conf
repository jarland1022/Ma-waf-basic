# ModSecurity 主入口
# /usr/local/nginx/conf/modsecurity/main.conf

Include /usr/local/nginx/conf/modsecurity/modsecurity.conf
Include /usr/local/nginx/conf/modsecurity/crs-setup.conf

# OWASP CRS 4.x（部署脚本会软链到实际路径）
Include /usr/local/nginx/conf/modsecurity/rules/*.conf

# 企业自定义（顺序：名单 → 上传 → 敏感信息 → Bot → 虚拟补丁）
Include /usr/local/nginx/conf/modsecurity/custom/*.conf
