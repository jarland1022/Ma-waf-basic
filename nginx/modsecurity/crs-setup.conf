# CRS 初始化覆盖（精简企业模板）
# 完整 crs-setup.conf 由部署脚本从 OWASP CRS 包复制后合并本文件策略
#
# CRS 4.x REQUEST-901-INITIALIZATION.conf 规则 901001：若未设置
# tx.crs_setup_version，会在 phase 1 直接 deny 500。

SecAction \
  "id:900990,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.crs_setup_version=42600"

SecAction \
  "id:900000,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.blocking_paranoia_level=2"

SecAction \
  "id:900001,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.detection_paranoia_level=2"

SecAction \
  "id:900100,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.critical_anomaly_score=5,\
   setvar:tx.error_anomaly_score=4,\
   setvar:tx.warning_anomaly_score=3,\
   setvar:tx.notice_anomaly_score=2"

# 早期阻断
SecAction \
  "id:900120,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.early_blocking=1"

# 允许的方法
SecAction \
  "id:900200,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

SecAction \
  "id:900220,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |application/json| |text/plain|'"
