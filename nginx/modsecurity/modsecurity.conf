# ModSecurity 3 + Nginx 兼容配置
# 已移除 MS2 / 部分 connector 不支持的指令:
#   SecServerSignature / SecStatusEngine / SecConnEngine / SecDataDir
# severity 仅允许: EMERGENCY|ALERT|CRITICAL|ERROR|WARNING|NOTICE|INFO|DEBUG

SecRuleEngine On

# ---------- 审计 ----------
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABCIFHJZ
# Parts: A头 B请求头 C请求体(含 POST) F响应头 H审计 I multipart 摘要 J上传元数据 Z结束
# 含 C 才能在事件中展示 POST body / 攻击字段载荷预览；体积会增大，已配合 RelevantOnly
SecAuditLogType Serial
SecAuditLog /data/logs/nginx/modsec_audit.json
# 若你的 libmodsecurity 过旧不支持 JSON，可注释下一行
SecAuditLogFormat JSON

SecDebugLog /data/logs/nginx/modsec_debug.log
SecDebugLogLevel 0

# ---------- 请求体 / 上传 ----------
SecRequestBodyAccess On
SecRequestBodyLimit 52428800
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject
SecArgumentSeparator &
SecTmpDir /tmp/modsec
SecUploadDir /tmp/modsec/upload
SecUploadKeepFiles Off
SecUploadFileLimit 10
SecUploadFileMode 0600

# ---------- 响应体 ----------
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json
SecResponseBodyLimit 524288
SecResponseBodyLimitAction ProcessPartial

# ---------- PCRE ----------
SecPcreMatchLimit 100000
SecPcreMatchLimitRecursion 100000

# ---------- 默认动作 ----------
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"

# 协议合规
SecRule REQUEST_PROTOCOL "!@within HTTP/1.0 HTTP/1.1 HTTP/2 HTTP/3" \
    "id:100001,phase:1,deny,status:400,msg:'Invalid HTTP protocol',tag:'protocol-enforcement',severity:'CRITICAL'"

# 存在 Transfer-Encoding 时强制解析 body
SecRule &REQUEST_HEADERS:Transfer-Encoding "@gt 0" \
    "id:100002,phase:1,pass,nolog,ctl:forceRequestBodyVariable=On"

# 异常字节
SecRule REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_FILENAME|ARGS_NAMES|ARGS|XML:/* \
    "@validateByteRange 1-255" \
    "id:100003,phase:2,deny,status:400,msg:'Invalid byte range',tag:'protocol-enforcement',severity:'CRITICAL',t:none,t:urlDecodeUni"

# 隐藏 Server 标识请用 Nginx: server_tokens off;
