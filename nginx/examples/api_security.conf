# API 安全防护示例 + OpenAPI 基线
# 将本文件片段合并进站点 server{}，或 include 后按需裁剪。
#
# 配套工具:
#   python3 tools/openapi_guard.py validate --spec /path/openapi.yaml --method POST --path /v1/orders --body '{}'
#   python3 tools/openapi_guard.py gen-rules --spec /path/openapi.yaml --out .../custom/130000-openapi.conf

# 为 /api/ 单独更严的限速（需在 http{} 已有 zone 或自行增加）
# limit_req_zone $binary_remote_addr$uri zone=api_perip:20m rate=5r/s;

location ^~ /api/ {
    limit_req zone=perip burst=10 nodelay;
    modsecurity on;
    modsecurity_rules_file /usr/local/nginx/conf/modsecurity/main.conf;

    # 仅允许常见 API 方法
    if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$) {
        return 405;
    }

    # Content-Type：写操作要求 JSON（GET/HEAD 无 body 时跳过）
    set $api_ct_check 0;
    if ($request_method ~ ^(POST|PUT|PATCH)$) {
        set $api_ct_check 1;
    }
    if ($http_content_type !~* "application/json") {
        set $api_ct_check "${api_ct_check}1";
    }
    if ($api_ct_check = 11) {
        return 415;
    }

    proxy_pass http://backend_app;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Content-Type $http_content_type;
}
