# stub_status — 仅本机，供 ma-waf-api 采集连接指标
# 路径: /usr/local/nginx/conf/conf.d/00-status.conf

server {
    listen 127.0.0.1:8081;
    server_name _;
    access_log off;
    allow 127.0.0.1;
    deny all;

    location = /nginx_status {
        stub_status;
    }

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
}
