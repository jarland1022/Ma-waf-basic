# 业务站点 + WAF 接入示例
# 路径: /usr/local/nginx/conf/conf.d/app.conf

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 慢速攻击缓解（client_header_timeout 仅允许在 http/server，不能放 location）
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;

    # 强制跳转 HTTPS（生产启用）
    # return 301 https://$host$request_uri;

    # 健康检查（供 LB / 监控，绕过 WAF 重逻辑）
    location = /waf-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","component":"nginx"}';
    }

    # 静态资源：跳过 ModSecurity，降低误报与 CPU
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|map)$ {
        modsecurity off;
        expires 7d;
        access_log off;
        try_files $uri @backend;
    }

    location / {
        # IP 黑白名单
        if ($waf_blacklist) { return 403; }
        if ($waf_whitelist) {
            # 白名单仍可记访问日志，但可选择关闭 ModSec
            # modsecurity off;
        }

        # Geo 封锁（安装 MMDB 并取消 geoip2 注释后启用）
        # if ($geo_block) { return 403; }

        if ($block_bad_bot) { return 403; }

        # 软 Bot / 脚本客户端：无 JS cookie 则跳转挑战页
        if ($need_js_challenge) { return 302 /waf-challenge.html?r=$request_uri; }
        # 可选 HMAC 硬校验（需 http_auth_request_module；站点控制台可启用）
        # auth_request /waf-challenge/verify;
        # error_page 401 =302 /waf-challenge.html?r=$request_uri;

        # 频率与连接限制
        limit_req  zone=perip burst=40 nodelay;
        limit_req  zone=perserver burst=400;
        limit_conn addr 50;

        # ModSecurity
        modsecurity on;
        modsecurity_rules_file /usr/local/nginx/conf/modsecurity/main.conf;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 后端故障：可改为返回维护页（fail 可见）或临时 DetectionOnly（由运维切换）
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_pass http://backend_app;

        # 可选 CSP / 安全响应头
        include snippets/csp_headers.conf;

        error_page 403 /waf-block.html;
        error_page 429 /waf-ratelimit.html;
        error_page 502 503 504 /waf-upstream.html;
    }

    location = /waf-challenge.html {
        # 公开挑战页（非 internal），ModSecurity 关闭避免自扰
        modsecurity off;
        root /usr/local/nginx/html/error_pages;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header X-Request-ID $request_id always;
    }

    include snippets/js_challenge_api.conf;

    location = /waf-block.html {
        internal;
        root /usr/local/nginx/html/error_pages;
        default_type text/html;
        # 未编译 ngx_http_sub_module 时不可使用 sub_filter；Request-ID 见响应头
        add_header X-Request-ID $request_id always;
    }
    location = /waf-block.en.html {
        root /usr/local/nginx/html/error_pages;
        default_type text/html;
        add_header X-Request-ID $request_id always;
    }
    location = /waf-ratelimit.html {
        internal;
        root /usr/local/nginx/html/error_pages;
        add_header X-Request-ID $request_id always;
    }
    location = /waf-upstream.html {
        internal;
        root /usr/local/nginx/html/error_pages;
        add_header X-Request-ID $request_id always;
    }

    location @backend {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_pass http://backend_app;
    }
}

# 管理控制台反向代理（强源 IP 限制）
server {
    listen 8443 ssl http2;
    server_name waf-admin.local;

    ssl_certificate     /usr/local/Ma-waf/conf/tls/admin.crt;
    ssl_certificate_key /usr/local/Ma-waf/conf/tls/admin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 仅允许管理网段（交付时按实际管理网修改）
    allow 127.0.0.1;
    allow ::1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny  all;

    # 管理面不做 CRS 全量检测，避免自扰；可保留基础限制
    modsecurity off;
    limit_req zone=perip burst=20 nodelay;
    # 本地规则库升级包（与 API 64MB 上限对齐）
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_request_buffering on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
