# API 前缀防护片段（由站点 EnableAPIProtect include）
# 依赖 http{} 中 zone=api_perip

limit_req zone=api_perip burst=15 nodelay;

# 仅允许常见 API 方法
if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$) {
    return 405;
}

# 写操作建议 JSON（宽松：缺省 Content-Type 时不拦，由 ModSec OpenAPI 规则审计）
# 严格模式可取消下列注释
# set $api_ct_check 0;
# if ($request_method ~ ^(POST|PUT|PATCH)$) { set $api_ct_check 1; }
# if ($http_content_type !~* "application/json") { set $api_ct_check "${api_ct_check}1"; }
# if ($api_ct_check = 11) { return 415; }
