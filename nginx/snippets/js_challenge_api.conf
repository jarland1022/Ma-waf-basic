# JS Challenge 签发/校验（反代到 ma-waf-api）
# 由各业务 server 通过 include 引入，或复制下列 location

# POST /waf-challenge/issue → 签发 HMAC Cookie
# GET  /waf-challenge/verify → auth_request 校验（需 http_auth_request_module）

location = /waf-challenge/issue {
    modsecurity off;
    proxy_pass http://127.0.0.1:9090/challenge/issue;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_hide_header Access-Control-Allow-Origin;
}

location = /waf-challenge/verify {
    internal;
    modsecurity off;
    proxy_pass http://127.0.0.1:9090/challenge/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header X-Real-IP $remote_addr;
}
