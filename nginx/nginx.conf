# Ma-WAF 主配置 — 基于 Nginx 1.24 企业级调优模板
# 安装后通常位于 /usr/local/nginx/conf/nginx.conf

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /data/logs/nginx/error.log warn;
pid       /usr/local/nginx/logs/nginx.pid;

# ModSecurity 等动态模块（由 scripts/repair_nginx_modules.sh 生成；缺失时为空，避免 -t 失败）
include modules-ma-waf.conf;

# 可选：GeoIP2 / Lua 模块请写入 modules-ma-waf.conf
# load_module modules/ngx_http_geoip2_module.so;
# load_module modules/ngx_http_lua_module.so;

events {
    worker_connections  8192;
    use                 epoll;
    multi_accept        on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ---------- 基础性能 ----------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    server_tokens       off;
    client_max_body_size 50m;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;
    reset_timedout_connection on;

    # ---------- 请求 ID（错误页 / 审计关联）----------
    map $request_id $req_id {
        default $request_id;
    }

    # ---------- JSON 访问日志 ----------
    log_format json_combined escape=json
      '{'
        '"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"http_user_agent":"$http_user_agent",'
        '"http_referer":"$http_referer",'
        '"host":"$host",'
        '"scheme":"$scheme"'
      '}';

    access_log /data/logs/nginx/access.json json_combined;

    # ---------- CC / 连接限制 ----------
    limit_req_zone  $binary_remote_addr zone=perip:20m  rate=20r/s;
    limit_req_zone  $server_name         zone=perserver:10m rate=200r/s;
    limit_req_zone  $binary_remote_addr$uri zone=api_perip:20m rate=8r/s;
    limit_conn_zone $binary_remote_addr  zone=addr:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # ---------- IP 黑白名单（可由管理 API 重写后 reload）----------
    geo $waf_whitelist {
        default 0;
        include geo/whitelist_ips.conf;
    }
    geo $waf_blacklist {
        default 0;
        include geo/blacklist_ips.conf;
    }

    # ---------- Geo 封锁（geo/geo_block_map.conf 由 API 在具备 MMDB+模块时改写）----------
    include geo/geo_block_map.conf;

    # ---------- Bot UA 粗分类 ----------
    # is_bad_bot: 已知扫描器 → 直接 403（善意 Bot 除外）
    # is_soft_bot: 空 UA / 脚本客户端 → JS Challenge
    # is_good_bot: 搜索引擎等（bot/00-good-bots.conf，可由 API 维护）
    include bot/00-good-bots.conf;
    map $http_user_agent $is_bad_bot {
        default                 0;
        ~*(sqlmap|nikto|nessus|masscan|zgrab|dirbuster|havij|w3af|acunetix) 1;
    }
    map $http_user_agent $is_soft_bot {
        default                 0;
        ""                      1;
        ~*(?:^curl/|^Wget/|^python-requests|^Go-http-client|^Java/|^libwww) 1;
    }
    map $cookie_ma_waf_js $challenge_ok {
        default 0;
        "1"     1;
        ~^v1\.[0-9]+\.[A-Za-z0-9_-]+$ 1;
    }
    # 善意 Bot 永不挑战；软 Bot 无 Cookie 则挑战
    map "$is_good_bot:$is_soft_bot:$challenge_ok" $need_js_challenge {
        default   0;
        "1:1:0"   0;
        "1:0:0"   0;
        "0:1:0"   1;
    }
    map "$is_good_bot:$is_bad_bot" $block_bad_bot {
        default 0;
        "0:1"   1;
    }

    # ---------- 上游 ----------
    upstream backend_app {
        server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # 模块化站点配置
    include conf.d/*.conf;
}
