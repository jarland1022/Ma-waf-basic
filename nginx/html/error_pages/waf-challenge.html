<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>安全验证 — Ma-WAF</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#0f172a;color:#e2e8f0}
    main{max-width:420px;padding:2rem;text-align:center}
    .brand{color:#38bdf8;letter-spacing:.12em;font-size:.8rem;text-transform:uppercase;margin-bottom:1rem}
    p{color:#94a3b8;line-height:1.6}
    button{margin-top:1.2rem;padding:.7rem 1.4rem;border:0;border-radius:8px;background:#38bdf8;color:#0f172a;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    .err{color:#f87171;font-size:.85rem;min-height:1.2em}
  </style>
</head>
<body>
  <main>
    <div class="brand">Ma-WAF</div>
    <h1>浏览器安全验证</h1>
    <p>检测到自动化特征。请点击下方按钮完成验证后继续访问。<br/>（需启用 JavaScript；Cookie 由管理面 HMAC 签名）</p>
    <div class="err" id="msg"></div>
    <button type="button" id="go">我是人类，继续访问</button>
  </main>
  <script>
(function () {
  var btn = document.getElementById("go");
  var msg = document.getElementById("msg");
  function dest() {
    var q = new URLSearchParams(location.search).get("r") || "/";
    if (q.charAt(0) !== "/") q = "/";
    return q;
  }
  function applyCookie(data) {
    if (data && data.value) {
      var maxAge = data.max_age || 3600;
      document.cookie = "ma_waf_js=" + encodeURIComponent(data.value) +
        "; path=/; max-age=" + maxAge + "; SameSite=Lax";
    }
  }
  async function pass() {
    btn.disabled = true;
    msg.textContent = "";
    try {
      var resp = await fetch("/waf-challenge/issue", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Accept": "application/json" }
      });
      if (!resp.ok) throw new Error("issue HTTP " + resp.status);
      var data = await resp.json();
      applyCookie(data);
      location.replace(dest());
    } catch (e) {
      // 回退：弱 Cookie（无签名），仍挡无 JS 客户端
      try {
        document.cookie = "ma_waf_js=1; path=/; max-age=3600; SameSite=Lax";
        location.replace(dest());
      } catch (e2) {
        msg.textContent = "验证失败，请检查浏览器 Cookie / 管理 API 是否可达";
        btn.disabled = false;
      }
    }
  }
  btn.addEventListener("click", function () { pass(); });
})();
  </script>
</body>
</html>
