<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>请求已被拦截 — Ma-WAF</title>
  <style>
    :root { --bg:#0f172a; --fg:#e2e8f0; --accent:#38bdf8; --muted:#94a3b8; }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(1200px 600px at 20% 10%, #1e293b, var(--bg));
      color: var(--fg);
    }
    main { max-width: 520px; padding: 2rem; text-align: center; }
    .brand { font-size:.85rem; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin-bottom:1rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: .5rem; }
    p { color: var(--muted); line-height: 1.6; }
    .rid { margin-top: 1.5rem; font-family: ui-monospace, Consolas, monospace;
           font-size: .85rem; color: var(--accent); word-break: break-all; }
    .lang { margin-top:1rem; font-size:.8rem; }
    .lang a { color:var(--accent); margin:0 .35rem; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Ma-WAF</div>
    <h1>请求已被安全策略拦截</h1>
    <p>您的请求触发了 Web 应用防火墙防护规则。如确认为误报，请联系管理员并提供请求编号。</p>
    <p class="rid">请查看响应头 <b>X-Request-ID</b>（本环境 Nginx 未启用 sub_filter，无法在页内嵌入 ID）</p>
    <p class="lang"><a href="/waf-block.en.html">English</a></p>
  </main>
</body>
</html>
