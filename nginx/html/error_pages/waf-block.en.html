<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Request Blocked — Ma-WAF</title>
  <style>
    :root { --bg:#0f172a; --fg:#e2e8f0; --accent:#38bdf8; --muted:#94a3b8; }
    body {
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 20% 10%, #1e293b, var(--bg));
      color: var(--fg);
    }
    main { max-width: 520px; padding: 2rem; text-align: center; }
    .brand { font-size:.85rem; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin-bottom:1rem; }
    h1 { font-size: 1.5rem; font-weight: 600; }
    p { color: var(--muted); line-height: 1.6; }
    .rid { margin-top: 1.5rem; font-family: ui-monospace, Consolas, monospace; color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <div class="brand">Ma-WAF</div>
    <h1>Request blocked by security policy</h1>
    <p>Your request triggered a Web Application Firewall rule. Contact your administrator with the Request ID from the <b>X-Request-ID</b> response header.</p>
  </main>
</body>
</html>
